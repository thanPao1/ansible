---
- name: "BMC Discovery | Bloque principal de ejecucion"
  block:

    - name: "AUTH | Obtener token de BMC Helix Discovery"
      ansible.builtin.uri:
        url:            "https://liverpool-disc-itom.onbmc.com/api/token"
        method:         POST
        headers:
          Content-Type: "application/x-www-form-urlencoded"
        body_format:    form-urlencoded
        body:
          grant_type: "password"
          username:   "{{ bmc_api_user }}"
          password:   "{{ bmc_api_password }}"
        validate_certs:   true
        follow_redirects: all
        status_code:      200
        timeout:          30
      register: bmc_auth_response
      no_log:   true

    - name: "AUTH | Guardar token en fact"
      ansible.builtin.set_fact:
        bmc_token: "{{ bmc_auth_response.json.access_token }}"
      no_log: true

    - name: "AUTH | Confirmar autenticacion exitosa"
      ansible.builtin.debug:
        msg: "Autenticacion exitosa en BMC Helix Discovery"

    - name: "OUTPOST | Obtener lista de Outposts registrados"
      ansible.builtin.uri:
        url:     "https://liverpool-disc-itom.onbmc.com/api/{{ bmc_api_version }}/discovery/outposts"
        method:  GET
        headers:
          Authorization: "Bearer {{ bmc_token }}"
        validate_certs:   true
        follow_redirects: all
        status_code:      200
        timeout:          30
      register: bmc_outposts_response

    - name: "OUTPOST | Construir mapa nombre -> id"
      ansible.builtin.set_fact:
        outpost_id_map: "{{ dict(bmc_outposts_response.json | map(attribute='name') | zip(bmc_outposts_response.json | map(attribute='id'))) }}"

    - name: "OUTPOST | Determinar Outpost para {{ target_ip }}"
      ansible.builtin.set_fact:
        target_outpost: "{{ item.0.outpost }}"
        target_segment: "{{ item.1 }}"
      loop: "{{ discovery_routes | subelements('segments') }}"
      when: target_ip | ip_in_network(item.1)

    - name: "OUTPOST | Validar asignacion de segmento"
      ansible.builtin.assert:
        that:
          - target_outpost is defined
          - target_segment is defined
        fail_msg: >-
          La IP {{ target_ip }} no pertenece a ningun segmento configurado
          en discovery_routes. Verifica vars/bmc-discovery-data.yml.

    - name: "OUTPOST | Resolver outpost_id dinamicamente"
      ansible.builtin.set_fact:
        target_outpost_id: "{{ outpost_id_map[target_outpost] | default('') }}"

    - name: "OUTPOST | Validar que el outpost existe en BMC"
      ansible.builtin.assert:
        that:
          - target_outpost_id != ''
        fail_msg: >-
          El outpost '{{ target_outpost }}' definido en discovery_routes ya no
          existe (o cambio de nombre) en BMC Helix Discovery. Verifica
          /discovery/outposts.

    - name: "OUTPOST | Mostrar asignacion"
      ansible.builtin.debug:
        msg: >-
          IP {{ target_ip }} →
          Segmento {{ target_segment }} →
          Outpost {{ target_outpost }} ({{ target_outpost_id }})

    - name: "SCAN | Crear Adhoc Discovery Run para {{ target_ip }}"
      ansible.builtin.uri:
        url:     "https://liverpool-disc-itom.onbmc.com/api/{{ bmc_api_version }}/discovery/runs"
        method:  POST
        headers:
          Authorization: "Bearer {{ bmc_token }}"
          Content-Type:  "application/json"
        body_format:      json
        body:
          label:      "Ansible-Adhoc-{{ target_ip }}-{{ execution_epoch }}"
          ranges:     ["{{ target_ip }}"]
          scan_kind:  "IP"
          outpost_id: "{{ target_outpost_id }}"
        validate_certs:   true
        follow_redirects: all
        status_code:      [200, 201, 202]
        timeout:          30
      register: bmc_scan_create_response

    - name: "SCAN | Guardar UUID del run creado"
      ansible.builtin.set_fact:
        scan_run_id: >-
          {{ bmc_scan_create_response.json.uuid
             | default(bmc_scan_create_response.json.id)
             | default('') }}

    - name: "SCAN | Confirmar creacion del scan"
      ansible.builtin.debug:
        msg: "Discovery Run creado | Run ID: {{ scan_run_id }} | Target: {{ target_ip }} | Outpost: {{ target_outpost }}"

    - name: "POLL | Esperar a que el Discovery Run termine"
      ansible.builtin.uri:
        url:     "https://liverpool-disc-itom.onbmc.com/api/{{ bmc_api_version }}/discovery/runs/{{ scan_run_id }}"
        method:  GET
        headers:
          Authorization: "Bearer {{ bmc_token }}"
        validate_certs:   true
        follow_redirects: all
        status_code:      200
        timeout:          30
      register: bmc_poll_response
      until: >
        bmc_poll_response.json.finished is defined and
        bmc_poll_response.json.finished | bool and
        not (bmc_poll_response.json.consolidating | default(false) | bool)
      retries: "{{ poll_max_retries }}"
      delay:   "{{ poll_interval_seconds }}"

    - name: "POLL | Guardar estado final del scan"
      ansible.builtin.set_fact:
        scan_final_status: "{{ 'Completed' if (bmc_poll_response.json.done | default(0) | int) == 1 else 'Unknown' }}"

    - name: "POLL | Mostrar estado final del scan"
      ansible.builtin.debug:
        msg:
          - "Estado final del scan: {{ scan_final_status }}"
          - "Scan ID: {{ scan_run_id }}"
          - "done={{ bmc_poll_response.json.done }} finished={{ bmc_poll_response.json.finished }}"

    - name: "POLL | Guardar estado final del scan"
      ansible.builtin.set_fact:
        scan_final_status: "{{ 'Completed' if (bmc_poll_response.json.done | default(0) | int) == 1 else 'Unknown' }}"

    - name: "POLL | Mostrar estado final del scan"
      ansible.builtin.debug:
        msg:
          - "Estado final del scan: {{ scan_final_status }}"
          - "Scan ID: {{ scan_run_id }}"
          - "done={{ bmc_poll_response.json.done }} finished={{ bmc_poll_response.json.finished }}"
    - name: "POLL | Fallar si el scan termino en error"
      ansible.builtin.fail:
        msg: "BMC Discovery Run {{ scan_run_id }} termino con estado: {{ scan_final_status }}"
      when: scan_final_status | lower in ['failed', 'cancelled', 'error']

    - name: "RESULT | Consultar resultados del Discovery Run"
      ansible.builtin.uri:
        url:     "https://liverpool-disc-itom.onbmc.com/api/{{ bmc_api_version }}/discovery/runs/{{ scan_run_id }}/results"
        method:  GET
        headers:
          Authorization: "Bearer {{ bmc_token }}"
        validate_certs:   true
        follow_redirects: all
        status_code:      200
        timeout:          30
      register: bmc_results_response

    - name: "RESULT | Guardar resumen de resultados"
      ansible.builtin.set_fact:
        scan_devices_found: "{{ bmc_results_response.json.total | default(0) }}"

    - name: "RESULT | Mostrar resumen del Discovery"
      ansible.builtin.debug:
        msg: |
          ================================================================
           BMC Helix Discovery | Scan Completado
          ----------------------------------------------------------------
           Target IP    : {{ target_ip }}
           Outpost      : {{ target_outpost }}
           Run ID       : {{ scan_run_id }}
           Estado Final : {{ scan_final_status }}
           Dispositivos : {{ scan_devices_found }}
          ================================================================

  rescue:
    - name: "ERROR | Registrar fallo de ejecucion"
      ansible.builtin.set_fact:
        scan_failed:        true
        scan_error_message: "{{ ansible_failed_result.msg | default('Error desconocido') }}"
        scan_failed_task:   "{{ ansible_failed_task.name | default('N/A') }}"

    - name: "ERROR | Log del fallo"
      ansible.builtin.debug:
        msg: "FALLO en: {{ scan_failed_task }} | Error: {{ scan_error_message }}"

  always:
    - name: "REPORT | Escribir reporte de estado"
      ansible.builtin.copy:
        content: |
          "target_ip","outpost","run_id","final_status","devices_found","failed_task","error_message"
          "{{ target_ip }}","{{ target_outpost | default('N/A') }}","{{ scan_run_id | default('N/A') }}","{{ 'FAILED' if scan_failed | default(false) else scan_final_status | default('N/A') }}","{{ scan_devices_found | default('N/A') }}","{{ scan_failed_task | default('N/A') }}","{{ scan_error_message | default('') | replace('"', '""') | replace('\n', ' ') }}"
        dest: "{{ hostvars['localhost'].local_fetch_path }}/status_report_{{ target_ip | replace('.', '_') }}.csv"
      changed_when: false
