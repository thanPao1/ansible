--- #main
# Base URL de la API (confirmada: el endpoint OAuth2 responde en us-2)
crowdstrike_base_url: "https://api.us-2.crowdstrike.com"

# CLiente (Vault)
cs_client_id: "{{ vault_cs_client_id }}"
cs_client_secret: "{{ vault_cs_client_secret }}"

# Endpoints usados
crowdstrike_oauth_endpoint: "{{ crowdstrike_base_url }}/oauth2/token"
crowdstrike_query_devices_endpoint: "{{ crowdstrike_base_url }}/devices/queries/devices/v1"
crowdstrike_device_detail_endpoint: "{{ crowdstrike_base_url }}/devices/entities/devices/v1"

# Campo usado como filtro en la consulta: "hostname" o "local_ip"
crowdstrike_filter_field: "hostname"

# Criterios para considerar el host "activo".
crowdstrike_max_last_seen_seconds: 900   # 15 min
crowdstrike_fail_on_rfm: true

# Reintentos mientras el sensor se registra en CrowdStrike
crowdstrike_gate_retries: 10
crowdstrike_gate_delay_seconds: 30
