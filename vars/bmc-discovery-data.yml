---
bmc_discovery_host: "https://liverpool-disc-itom.onbmc.com"
bmc_api_version: "v1.18"
bmc_vault_path: "ansible_discovery_automation"

scan_level: "Full Discovery"
scan_timeout_minutes: 30
poll_interval_seconds: 15
poll_max_retries: 120

local_fetch_path: "/tmp/ansible_bmc_reports_{{ now(utc=True, fmt='%Y%m%d%H%M%S') }}"
consolidated_report_name: "report-BMCDiscovery-{{ now(utc=True, fmt='%Y-%m-%dT%H%M%SZ') }}.csv"

discovery_routes:
  - outpost: "MTYBMCPAP04_Cloud"
    segments:
      - "172.18.0.0/16"

  - outpost: "MTYBMCPAP01_Zona_Segura"
    segments:
      - "172.17.201.0/24"
      - "172.17.202.0/24"
      - "172.17.203.0/24"
      - "172.17.204.0/24"
      - "172.17.205.0/24"
      - "172.17.206.0/24"
      - "172.17.207.0/24"
      - "172.17.210.0/24"
      - "172.17.211.0/24"
      - "172.21.203.0/24"
      - "10.101.4.0/24"
      - "10.101.125.0/24"
      - "172.17.224.0/24"
