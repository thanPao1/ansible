---
- name: Gate de validación CrowdStrike - host activo con AID
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/main.yml
    - vars/crowdstrike-secrets.yml

  tasks:
    - name: Pretasks - validaciones y autenticación
      ansible.builtin.import_tasks: crowdstrike-tasks/crowdstrike-pretasks.yml

    - name: Run - consulta y validación del AID
      ansible.builtin.import_tasks: crowdstrike-tasks/crowdstrike-run.yml

    - name: Postasks - resultado del gate
      ansible.builtin.import_tasks: crowdstrike-tasks/crowdstrike-postasks.yml
